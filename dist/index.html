<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Log<span class="brand-dot">.</span></strong><button id="signout" hidden>Sign out</button></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="auth" class="auth"><h1>Your items. Your conversations.</h1><p>Sign in with your bnaimitzvah account to open your logs.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="primary" type="submit">Sign in</button></form></section>
<main id="workspace" hidden><aside><div class="aside-title"><h1>Items</h1><span id="count">0</span></div><div id="items" role="listbox" aria-label="Items" tabindex="0"></div><div class="item-actions"><button id="add" class="primary">Add item</button><button id="change" disabled>Change</button><button id="delete" disabled>Delete</button></div></aside>
<section class="log-panel"><div class="toolbar"><button id="log" class="primary" disabled>Log</button><h2 id="title">Select an item</h2></div><div id="welcome" class="empty"><h2>A place to keep the conversation.</h2><p>Add an item on the left, then open its log.</p></div><section id="conversation" hidden><div id="records" aria-label="Saved records" aria-live="polite"></div><form id="compose"><fieldset><legend>New entry from</legend><label><input type="radio" name="speaker" value="Me" checked> Me</label><label><input type="radio" name="speaker" value="Other"> Other</label></fieldset><label class="text-label" for="body">Entry</label><textarea id="body" rows="4" maxlength="20000" placeholder="Write a new entry…" required></textarea><div class="compose-footer"><span>Saved with the date first entered</span><button id="save" class="primary" type="submit">Save entry</button></div></form></section></section></main>
<dialog id="item-dialog"><form id="item-form"><h2 id="dialog-title">Add item</h2><label>Item name<input id="item-name" required maxlength="200" autocomplete="off"></label><div class="dialog-actions"><button id="cancel" type="button">Cancel</button><button class="primary" type="submit">Save item</button></div></form></dialog>
<script src="app.js" defer></script></body></html>
