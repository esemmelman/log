<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log</title><link rel="stylesheet" href="style.css?v=f26b87db2827"></head><body>
<main id="workspace" hidden>
<div class="entry-row"><textarea id="entry" rows="1" aria-label="Entry or search" aria-describedby="status" readonly autocomplete="off"></textarea><button id="go" type="button">Go</button></div>
<section id="records" aria-label="Entries, newest first"></section><p id="empty"></p>
<footer><button id="signout" type="button">Sign out</button><span id="version" aria-label="App version"></span></footer>
</main>
<section id="auth" class="auth" hidden><h1>Log</h1><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section>
<div id="status" role="status" aria-live="polite"></div>
<script src="app.js?v=719088dbf62e" defer></script></body></html>
