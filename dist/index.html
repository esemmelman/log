<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Log<span class="brand-dot">.</span></strong><button id="signout" hidden>Sign out</button></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="auth" class="auth"><h1>Your items. Your conversations.</h1><p>Sign in with your bnaimitzvah account to open your logs.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="primary" type="submit">Sign in</button></form></section>
<main id="workspace" hidden><aside class="items-picker"><div class="aside-title"><h1>Items</h1><span id="add" class="add-icon" tabindex="0" aria-label="Add item" title="Add item">+</span><span id="count">0</span></div><div id="items" role="listbox" aria-label="Items" tabindex="0"></div><div id="item-actions" class="item-actions" hidden><button id="change" disabled>Change</button><button id="delete" disabled>Delete</button></div></aside>
<section class="log-panel"><div class="toolbar"><button id="log" class="primary" aria-pressed="true" title="Click to toggle logs; double-click to start a new entry">Log</button></div><div id="welcome" class="empty"><p>Select an item to see its entries while Log is on.</p></div><section id="conversation" hidden><form id="compose" hidden><fieldset><legend>Entry from</legend><label><input type="radio" name="speaker" value="Me" checked> Me</label><label><input type="radio" name="speaker" value="Other"> Other</label></fieldset><label class="text-label" id="entry-label">Entry</label><div class="editor-toolbar" id="editor-toolbar" role="toolbar" aria-label="Text formatting"><button type="button" data-command="undo" title="Undo" aria-label="Undo">Undo</button><button type="button" data-command="redo" title="Redo" aria-label="Redo">Redo</button><button type="button" data-command="bold" title="Bold" aria-label="Bold"><b>B</b></button><button type="button" data-command="italic" title="Italic" aria-label="Italic"><i>I</i></button><button type="button" data-command="underline" title="Underline" aria-label="Underline"><u>U</u></button><button type="button" data-command="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button><button type="button" data-command="formatBlock" data-value="h2" title="Heading" aria-label="Heading">Heading</button><button type="button" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">Bullets</button><button type="button" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">Numbers</button><button type="button" data-command="justifyLeft" title="Align left" aria-label="Align left">Left</button><button type="button" data-command="justifyCenter" title="Align center" aria-label="Align center">Center</button><button type="button" data-command="justifyRight" title="Align right" aria-label="Align right">Right</button><button type="button" data-command="createLink" title="Insert link" aria-label="Insert link">Link</button><button type="button" data-command="unlink" title="Remove link" aria-label="Remove link">Unlink</button><button type="button" data-command="removeFormat" title="Clear formatting" aria-label="Clear formatting">Clear</button><button type="button" data-command="formatBlock" data-value="p">Paragraph</button></div><div id="body" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="entry-label" data-placeholder="Write an entry..."></div><div class="compose-footer"><span id="save-status" role="status" aria-live="polite">Click Save to add this entry, or Cancel to discard it.</span><div class="entry-actions"><button id="cancel-entry" type="button">Cancel</button><button id="save-entry" class="primary" type="submit">Save</button></div></div></form><div id="records" aria-label="Saved records" aria-live="polite"></div></section></section></main>
<dialog id="item-dialog"><form id="item-form"><h2 id="dialog-title">Add item</h2><label>Item name<input id="item-name" required maxlength="200" autocomplete="off"></label><div class="dialog-actions"><button id="cancel" type="button">Cancel</button><button class="primary" type="submit">Save item</button></div></form></dialog>
<script src="app.js" defer></script></body></html>
