<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log</title><link rel="stylesheet" href="style.css?v=ee68cc8f20f4"></head><body>
<main id="workspace" hidden>
<input id="entry" aria-label="New entry" aria-describedby="status" placeholder="Click to speak · Double-click to type" title="Click to speak. Double-click or press F2 to type. Press Enter to save text." readonly autocomplete="off">
<input id="search" type="search" aria-label="Search entries" placeholder="Search entries…" autocomplete="off">
<section id="records" aria-label="Entries, newest first"></section><p id="empty"></p>
<footer><button id="signout" type="button">Sign out</button><span id="version" aria-label="App version"></span></footer>
</main>
<section id="auth" class="auth"><h1>Log</h1><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section>
<div id="status" role="status" aria-live="polite"></div>
<script src="app.js?v=d84df5cbd551" defer></script></body></html>
